<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>East Africa El Niño OND 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  color-scheme: light;
  --page:#f1f4f7; --surface:#fbfcfd; --surface-2:#e0e6ec; --ink:#1c212a; --ink-2:#485462; --muted:#7a8592;
  --hair:#dfe4ea; --axis:#c3c9d1; --brand:#2380b0; --brand-ink:#f7fbfd; --navy:#1c212a;
  --caution-bg:#fbf3e2; --caution-ink:#7a5106; --caution-edge:#a06a08;
  /* diverging crop outlook: red = adverse, blue = favourable, grey = mixed */
  --o-m2:#c23b3a; --o-m1:#f0a29c; --o-0:#cfccc3; --o-p1:#86b6ef; --o-p2:#256abf; --o-na:#f1f0ec;
  /* categorical crop stage (3 slots) */
  --s-1:#2a78d6; --s-2:#eb6834; --s-3:#1baf7a;
  --county-edge:#fbfcfd; --zone-edge:#1c212a; --flood:#1c212a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0f1217; --surface:#171b22; --surface-2:#232a33; --ink:#eef2f5; --ink-2:#b9c2cc; --muted:#8a95a2;
    --hair:#2a313b; --axis:#3a434f; --brand:#3db4f2; --brand-ink:#0f1217; --navy:#0b0e12;
    --caution-bg:#2d2412; --caution-ink:#f0c46a; --caution-edge:#c98a12;
    --o-m2:#e66767; --o-m1:#8f3b3b; --o-0:#3a3a37; --o-p1:#256abf; --o-p2:#6da7ec; --o-na:#22252a;
    --s-1:#3987e5; --s-2:#d95926; --s-3:#199e70;
    --county-edge:#171b22; --zone-edge:#eef2f5; --flood:#eef2f5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0f1217; --surface:#171b22; --surface-2:#232a33; --ink:#eef2f5; --ink-2:#b9c2cc; --muted:#8a95a2;
  --hair:#2a313b; --axis:#3a434f; --brand:#3db4f2; --brand-ink:#0f1217; --navy:#0b0e12;
  --caution-bg:#2d2412; --caution-ink:#f0c46a; --caution-edge:#c98a12;
  --o-m2:#e66767; --o-m1:#8f3b3b; --o-0:#3a3a37; --o-p1:#256abf; --o-p2:#6da7ec; --o-na:#22252a;
  --s-1:#3987e5; --s-2:#d95926; --s-3:#199e70;
  --county-edge:#171b22; --zone-edge:#eef2f5; --flood:#eef2f5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--brand)}
header.top{background:var(--navy);color:#eef2f5;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header.top .mark{font-weight:700;letter-spacing:.06em}
header.top .dom{opacity:.85}
header.top .sp{flex:1}
header.top button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#eef2f5;border-radius:6px;padding:3px 10px;cursor:pointer;font:inherit;font-size:12px}
main{max-width:1280px;margin:0 auto;padding:16px}
h1{font-size:22px;line-height:1.25;margin:4px 0 4px}
.sub{color:var(--ink-2);margin:0 0 12px}
.caveat{background:var(--caution-bg);color:var(--caution-ink);border-left:4px solid var(--caution-edge);border-radius:6px;padding:10px 12px;margin:0 0 16px;font-size:13px}
.caveat b{color:inherit}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:14px}
.card h2{font-size:15px;margin:0 0 8px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink-2);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
label.chk{font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
#map{width:100%;position:relative}
#map svg{width:100%;height:auto;display:block}
.county{stroke:var(--county-edge);stroke-width:.6;cursor:pointer}
.county:hover{stroke:var(--zone-edge);stroke-width:1.6}
.zone-outline{fill:none;stroke:var(--zone-edge);stroke-width:1.4;pointer-events:none;stroke-opacity:.8;stroke-linejoin:round}
.zone-outline.sel{stroke-width:3.2;stroke-opacity:1}
.hatch{pointer-events:none}
.zlabel{font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
.flood path{fill:var(--flood)}
.flood text{font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.legend span.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:5px;border:1px solid var(--hair)}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;max-width:240px;z-index:5}
.tip b{display:block}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;border:1px solid var(--axis)}
#detail h3{margin:2px 0 4px;font-size:17px}
#detail .counties{color:var(--muted);font-size:12px;margin:0 0 10px}
#detail dl{margin:0}
#detail dt{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin-top:10px}
#detail dd{margin:2px 0 0}
#detail ul{margin:2px 0 0;padding-left:18px}
.cite{font-size:11px;color:var(--brand);font-weight:600;cursor:help;white-space:nowrap}
.zone-list{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.zone-list button{display:flex;gap:8px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--hair);border-radius:6px;padding:6px 8px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.zone-list button .sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid var(--hair)}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:900px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile .k{font-size:12px;color:var(--ink-2)}
.tile .v{font-size:22px;font-weight:700;line-height:1.2;margin:2px 0}
.tile .s{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.chart .ax text{font-size:10.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .ax line,.chart .ax path{stroke:var(--axis)}
.chart .grid line{stroke:var(--hair)}
.cal{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px}
.cal th{font-weight:600;color:var(--ink-2);text-align:center}
.cal td.lab{color:var(--ink);white-space:nowrap;padding-right:6px}
.cal td.c{height:24px;border-radius:4px;background:var(--surface-2);text-align:center;font-size:11px;color:#fff}
table.src{width:100%;border-collapse:collapse;font-size:12.5px}
table.src th,table.src td{border-bottom:1px solid var(--hair);padding:6px 6px;text-align:left;vertical-align:top}
table.src th{color:var(--ink-2);font-weight:600}
.badge{font-size:11px;border-radius:4px;padding:1px 6px;border:1px solid var(--axis);white-space:nowrap}
.badge.ma{border-color:#1f7a4d;color:#1f7a4d}
.tblwrap{overflow-x:auto}
details summary{cursor:pointer;color:var(--brand);font-size:13px}
footer{color:var(--muted);font-size:12px;margin:18px 0 8px}
iframe.prov{width:100%;height:520px;border:1px solid var(--hair);border-radius:8px;background:var(--surface)}
.cty{margin:0 0 10px}
.cty button{font-size:14px;padding:6px 14px}
</style>
</head>
<body>
<header class="top">
  <span class="mark">SERVIR</span><span class="dom">Global Risk Platform · Food Security Platform</span>
  <span class="sp"></span>
  <button id="themeBtn" type="button" aria-label="Toggle light/dark theme">Theme</button>
</header>
<main>
  <div class="seg cty" role="group" aria-label="Country">
    <button type="button" data-cty="kenya" aria-pressed="true">Kenya</button>
    <button type="button" data-cty="ethiopia" aria-pressed="false">Ethiopia</button>
    <button type="button" data-cty="uganda" aria-pressed="false">Uganda</button>
  </div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="caveat" id="caveat"></div>

  <div class="grid">
    <section class="card">
      <div class="controls">
        <div class="seg" role="group" aria-label="Map layer" id="viewSeg">
          <button type="button" data-view="outlook" aria-pressed="true">Crop impact outlook</button>
          <button type="button" data-view="stage" aria-pressed="false">Crop stage during OND</button>
        </div>
        <label class="chk" id="floodLbl"><input type="checkbox" id="floodChk" checked> River flood hotspots</label>
      </div>
      <div id="map"><div class="tip" id="tip"></div></div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="card" id="side"><div id="detail"></div></aside>
  </div>

  <div class="row" id="tiles"></div>

  <div class="two">
    <section class="card chart">
      <h2 id="oniTitle"></h2>
      <div id="oniChart"></div>
      <div class="legend"><span>Observed 3-month running Niño-3.4 anomaly, NOAA CPC, through JJA 2026. Dashed line marks the +0.5 °C El Niño threshold.</span></div>
    </section>
    <section class="card chart">
      <h2 id="iodTitle"></h2>
      <div id="iodChart"></div>
      <div class="legend" id="iodNote"></div>
    </section>
  </div>

  <section class="card" style="margin-top:16px">
    <h2 id="calTitle"></h2>
    <div class="tblwrap"><table class="cal" id="cal"></table></div>
    <div class="legend" id="calNote"></div>
  </section>

  <section class="card" style="margin-top:16px">
    <h2>Evidence and provenance</h2>
    <p style="margin:0 0 8px;font-size:13px;color:var(--ink-2)" id="provNote"></p>
    <iframe class="prov" id="provFrame" title="Provenance graph (live)" loading="lazy"></iframe>
    <p style="font-size:12.5px;margin:6px 0 12px" id="provLinks"></p>
    <div class="tblwrap"><table class="src" id="src"></table></div>
    <details style="margin-top:10px"><summary id="ctabSum"></summary><div class="tblwrap"><table class="src" id="ctab"></table></div></details>
  </section>

  <footer id="foot"></footer>
</main>

const COUNTRIES = {kenya:KENYA, ethiopia:ETHIOPIA, uganda:UGANDA};

// ================= rendering =================
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let C = KENYA, view = "outlook", selected = null;
const cite = (s,src) => s.replace(/<c>(\w+)<\/c>/g,(m,n)=>` <span class="cite" data-c="${n}">[${n}]</span>`).replace(/<cS>(\w+)<\/cS>/g,(m,n)=>` <span class="cite" data-c="${n}">[${n}]</span>`);
const scoreKey = z => String(C.zones[z].score);
const fillFor = z => view==="outlook" ? css(OUT_VAR[scoreKey(z)]) : css(STAGE_VAR[C.zones[z].stage]);
const outLabel = z => C.outlook[scoreKey(z)];
const stageLabel = z => C.stage[C.zones[z].stage];
function bindCites(root){
  root.querySelectorAll(".cite").forEach(el=>{const s=C.sources[el.dataset.c]; if(s) el.title=`${s.pub}: ${s.title} (${s.date}; ${s.val})`;});
}

let svg,proj,path,gC,gH,gZ,gL,gF,pat;
const W=600;
function drawMap(){
  const host=document.getElementById("map");
  host.querySelector("svg")?.remove();
  const b=d3.geoPath(d3.geoIdentity()).bounds(C.geo), H=Math.round(W*(b[1][1]-b[0][1])/(b[1][0]-b[0][0]))+20;  // planar bounds (RFC7946 winding breaks d3.geoBounds)
  svg=d3.select(host).append("svg").attr("viewBox",`0 0 ${W} ${H}`).attr("role","img")
     .attr("aria-label",`Map of ${C.name} ${C.units} coloured by El Niño impact zone`);
  proj=d3.geoIdentity().reflectY(true).fitExtent([[10,10],[W-10,H-10]],C.geo);
  path=d3.geoPath(proj);
  const tip=document.getElementById("tip");
  gC=svg.append("g"); gH=svg.append("g"); gZ=svg.append("g"); gL=svg.append("g"); gF=svg.append("g").attr("class","flood");
  pat=svg.append("defs").append("pattern").attr("id","hatchP").attr("patternUnits","userSpaceOnUse").attr("width",7).attr("height",7).attr("patternTransform","rotate(45)");
  pat.append("line").attr("x1",0).attr("y1",0).attr("x2",0).attr("y2",7).attr("stroke-width",1.4);
  gC.selectAll("path").data(C.geo.features).join("path").attr("class","county").attr("d",path)
    .on("mousemove",(e,d)=>{
      const z=d.properties.zone, r=host.getBoundingClientRect();
      tip.innerHTML=`<b>${d.properties.county}</b>${C.zones[z].name}<br>${view==="outlook"?outLabel(z):stageLabel(z)}`;
      tip.style.display="block";
      let x=e.clientX-r.left+12; if(x>r.width-250) x=e.clientX-r.left-250;
      tip.style.left=x+"px"; tip.style.top=(e.clientY-r.top+12)+"px";
    })
    .on("mouseleave",()=>tip.style.display="none")
    .on("click",(e,d)=>select(d.properties.zone));
  gH.selectAll("path").data(C.zgeo.features.filter(f=>f.properties.zone===C.hatch)).join("path").attr("class","hatch").attr("d",path).attr("fill","url(#hatchP)");
  gZ.selectAll("path").data(C.zgeo.features).join("path").attr("d",path).attr("class","zone-outline").attr("data-z",d=>d.properties.zone);
  const lp = k => C.labelPos[k] || (()=>{const f=C.zgeo.features.find(f=>f.properties.zone===k); return f?[f.properties.lab_lon,f.properties.lab_lat]:null;})();
  gL.selectAll("text").data(Object.keys(C.zones).filter(k=>C.zones[k].short && lp(k))).join("text").attr("class","zlabel").attr("text-anchor","middle")
    .attr("x",k=>proj(lp(k))[0]).attr("y",k=>proj(lp(k))[1]).text(k=>C.zones[k].short);
  const fg=gF.selectAll("g").data(C.floods).join("g").attr("transform",d=>`translate(${proj(d.ll)})`);
  fg.append("path").attr("d",DROP);
  fg.append("text").attr("x",d=>proj(d.ll)[0]>W-150?-8:8).attr("text-anchor",d=>proj(d.ll)[0]>W-150?"end":"start").attr("y",4).text(d=>d.n);
  document.getElementById("floodLbl").style.display = C.floods.length?null:"none";
}
function paint(){
  gC.selectAll("path").attr("fill",d=>fillFor(d.properties.zone));
  gZ.selectAll("path").classed("sel",function(){return this.dataset.z===selected});
  gZ.selectAll("path.sel").raise();
  pat.select("line").attr("stroke",css("--muted"));
  gH.style("display",view==="outlook"?null:"none");
  gF.style("display",(C.floods.length && document.getElementById("floodChk").checked)?null:"none");
  const used=[...new Set(Object.keys(C.zones).map(k=>view==="outlook"?scoreKey(k):C.zones[k].stage))];
  const items = view==="outlook"
    ? ["-2","-1","0","1","2","na"].filter(k=>used.includes(k)).map(k=>[css(OUT_VAR[k]),C.outlook[k]])
        .concat([[`repeating-linear-gradient(45deg,${css('--o-0')} 0 3px,${css('--muted')} 3px 4.4px)`,C.hatchLabel]])
    : ["harvest","plant","pastoral","na"].filter(k=>used.includes(k)).map(k=>[css(STAGE_VAR[k]),C.stage[k]]);
  const L=document.getElementById("legend");
  L.innerHTML = items.map(([c,l])=>`<span><span class="sw" style="background:${c}"></span>${l}</span>`).join("")
    + ((C.floods.length && document.getElementById("floodChk").checked)?`<span><svg width="12" height="14" viewBox="-6 -8 12 14" style="vertical-align:-2px;margin-right:4px"><path d="${DROP}" fill="${css('--flood')}"/></svg>River flood hotspot (approx.) <span class="cite" data-c="${C.floodCite}">[${C.floodCite}]</span></span>`:"");
  bindCites(L);
}
const unitsIn = k => C.geo.features.filter(f=>f.properties.zone===k).map(f=>f.properties.county).sort().join(", ");
function overview(){
  const D=document.getElementById("detail");
  D.innerHTML = `<h2>What El Niño means for OND 2026 in ${C.name}</h2><p style="margin:0 0 8px">${cite(C.overview)}</p>
   <p style="margin:0 0 6px;font-size:13px;color:var(--ink-2)">Select a zone on the map or below for crop-specific impacts.</p>
   <div class="zone-list">${Object.entries(C.zones).filter(([k,z])=>z.score!=="na").map(([k,z])=>`<button type="button" data-z="${k}"><span class="sw" style="background:${fillFor(k)}"></span><span><b>${z.name}</b><br><span style="font-size:12px;color:var(--ink-2)">${outLabel(k)}</span></span></button>`).join("")}</div>`;
  D.querySelectorAll("button[data-z]").forEach(b=>b.onclick=()=>select(b.dataset.z));
  bindCites(D);
}
function select(k){
  selected=k; paint();
  const z=C.zones[k], D=document.getElementById("detail"), sc=scoreKey(k);
  const list=a=>`<ul>${a.map(s=>`<li>${cite(s)}</li>`).join("")}</ul>`;
  D.innerHTML=`<button type="button" id="back" style="background:none;border:0;color:var(--brand);padding:0;cursor:pointer;font:inherit;font-size:13px">← All zones</button>
   <h3>${z.name}</h3>
   <span class="pill" style="background:${css(OUT_VAR[sc])};color:${sc==="2"||sc==="-2"?'#fff':'var(--ink)'}">${outLabel(k)}</span>
   <span class="pill" style="margin-left:4px">OND stage: ${stageLabel(k)}</span>
   <p class="counties" style="margin-top:8px">${unitsIn(k)}</p>
   <dl><dt>Rainfall tendency (analogue)</dt><dd>${list(z.rain)}</dd><dt>Maize</dt><dd>${list(z.maize)}</dd>
   <dt>Other crops & livelihoods</dt><dd>${list(z.other)}</dd><dt>What to watch</dt><dd>${list(z.watch)}</dd></dl>`;
  document.getElementById("back").onclick=()=>{selected=null;paint();overview();};
  bindCites(D);
}

// ---- drivers (shared values; citation numbers follow the active country's pack) ----
const ONI=[["JAS 25",-0.26],["ASO",-0.43],["SON",-0.57],["OND",-0.61],["NDJ",-0.6],["DJF 26",-0.39],["JFM",-0.21],["FMA",0.11],["MAM",0.46],["AMJ",0.95],["MJJ",1.39],["JJA 26",1.8]];
const IOD=[["Jun 25",-0.014],["Jul",-0.072],["Aug",-0.42],["Sep",-0.467],["Oct",-0.448],["Nov",-0.256],["Dec",-0.017],["Jan 26",0.123],["Feb",0.529],["Mar",0.285],["Apr",0.279],["May 26",0.146]];
function drivers(){
  const d=C.drivers, c=n=>`<span class="cite" data-c="${n}">[${n}]</span>`;
  const tiles=[{k:"ENSO alert status (NOAA CPC)",v:"El Niño Advisory",s:"10 Sep 2026 discussion",c:d.cpc},
    {k:"Niño-3.4 weekly (IRI)",v:"+3.0 °C",s:"mid-Sep 2026; very strong event",c:d.iri},
    {k:"ONI (observed)",v:"+1.8 °C",s:"JJA 2026, strong El Niño",c:d.oni},
    {k:"IOD outlook (IRI models)",v:"Strongly positive",s:"Sep–Dec 2026 forecast",c:d.iri}];
  document.getElementById("tiles").innerHTML=tiles.map(t=>`<div class="card tile"><div class="k">${t.k} ${c(t.c)}</div><div class="v">${t.v}</div><div class="s">${t.s}</div></div>`).join("");
  document.getElementById("oniTitle").innerHTML=`Oceanic Niño Index (ONI), °C ${c(d.oni)}`;
  document.getElementById("iodTitle").innerHTML=`Indian Ocean Dipole (DMI), °C ${c(d.iod)}`;
  document.getElementById("iodNote").innerHTML=`<span>Observed, NOAA PSL (HadISST), through 2026-05 only (this series lags). The positive-IOD expectation for Sep–Dec 2026 comes from IRI model forecasts ${c(d.iri)}, not this series.</span>`;
  document.getElementById("oniChart").innerHTML=""; document.getElementById("iodChart").innerHTML="";
  line("#oniChart",ONI,[0.5],[-1,2],css("--s-1"));
  line("#iodChart",IOD,[0.4,-0.4],[-0.6,0.6],css("--s-1"));
}
function line(el,data,thr,dom,col){
  const w=520,h=200,m={t:12,r:28,b:26,l:34};
  const s=d3.select(el).append("svg").attr("viewBox",`0 0 ${w} ${h}`);
  const x=d3.scalePoint(data.map(d=>d[0]),[m.l,w-m.r]);
  const y=d3.scaleLinear(dom,[h-m.b,m.t]).nice();
  s.append("g").attr("class","grid").selectAll("line").data(y.ticks(5)).join("line").attr("x1",m.l).attr("x2",w-m.r).attr("y1",y).attr("y2",y);
  s.append("g").attr("class","ax").attr("transform",`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(0).tickPadding(6)).select(".domain").remove();
  s.append("g").attr("class","ax").attr("transform",`translate(0,${h-m.b})`).call(d3.axisBottom(x).tickSize(0).tickPadding(8).tickValues(data.map(d=>d[0]).filter((_,i)=>i%2===0||i===data.length-1)));
  s.append("line").attr("x1",m.l).attr("x2",w-m.r).attr("y1",y(0)).attr("y2",y(0)).attr("stroke",css("--axis"));
  thr.forEach(t=>s.append("line").attr("x1",m.l).attr("x2",w-m.r).attr("y1",y(t)).attr("y2",y(t)).attr("stroke",css("--muted")).attr("stroke-dasharray","4 3"));
  s.append("path").datum(data).attr("fill","none").attr("stroke",col).attr("stroke-width",2).attr("d",d3.line().x(d=>x(d[0])).y(d=>y(d[1])));
  const last=data[data.length-1];
  s.append("circle").attr("cx",x(last[0])).attr("cy",y(last[1])).attr("r",4).attr("fill",col).attr("stroke",css("--surface")).attr("stroke-width",2);
  s.append("text").attr("x",x(last[0])-6).attr("y",y(last[1])-8).attr("text-anchor","end").attr("font-size",11).attr("fill",css("--ink")).text(`${last[1]>0?"+":""}${last[1]}`);
  const hl=s.append("line").attr("stroke",css("--axis")).attr("y1",m.t).attr("y2",h-m.b).style("display","none");
  const ht=s.append("text").attr("font-size",11).attr("fill",css("--ink")).style("display","none");
  s.append("rect").attr("x",m.l).attr("y",m.t).attr("width",w-m.l-m.r).attr("height",h-m.t-m.b).attr("fill","transparent")
   .on("mousemove",e=>{const [mx]=d3.pointer(e);const i=d3.minIndex(data,d=>Math.abs(x(d[0])-mx));const d=data[i];
     hl.attr("x1",x(d[0])).attr("x2",x(d[0])).style("display",null);
     ht.attr("x",Math.min(x(d[0])+6,w-90)).attr("y",m.t+10).text(`${d[0]}: ${d[1]>0?"+":""}${d[1]} °C`).style("display",null);})
   .on("mouseleave",()=>{hl.style("display","none");ht.style("display","none");});
}
function calendar(){
  const k=C.calendar;
  document.getElementById("calTitle").innerHTML=`${k.title} <span class="cite" data-c="${k.cite}">[${k.cite}]</span>`;
  document.getElementById("cal").innerHTML=`<tr><th></th>${k.months.map(m=>`<th>${m}</th>`).join("")}</tr>`+
    k.rows.map(([lab,cells,v])=>`<tr><td class="lab">${lab}</td>${k.months.map(m=>m in cells?`<td class="c" style="background:${css(v)}">${cells[m]}</td>`:`<td class="c"></td>`).join("")}</tr>`).join("");
  document.getElementById("calNote").innerHTML=`<span>${cite(k.note)}</span>`;
}
function provenance(){
  document.getElementById("provNote").innerHTML=`The ${C.name} narrative behind this map passed the platform's groundedness gate as receipt <code>${C.receipt}</code>. The gate checks citation mechanics, not whether each source supports its claim. The panel below resolves live from the platform each time the page opens; it is not frozen into this file.`;
  const f=document.getElementById("provFrame"), src=`https://servirplatform.sig-gis.com/?embed=provenance_graph&receipt_id=${C.receipt}`;
  if(f.getAttribute("src")!==src) f.setAttribute("src",src);
  document.getElementById("provLinks").innerHTML=`<a href="https://servirplatform.sig-gis.com/api/resolve/receipt/${C.receipt}" target="_blank" rel="noopener">Resolve receipt ${C.receipt}</a> · pack <code>${C.pack}</code> · pack assembled ${C.assembled}`;
  document.getElementById("src").innerHTML=`<tr><th>#</th><th>Publisher</th><th>Document / feed</th><th>Date</th><th>Validation</th></tr>`+
    C.used.map(k=>{const s=C.sources[k];return `<tr><td>${k}</td><td>${s.pub}</td><td>${s.url?`<a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>`:s.title}</td><td style="white-space:nowrap">${s.date}</td><td><span class="badge ${s.val==='multi-agency-consensus'?'ma':''}">${s.val}</span></td></tr>`}).join("");
  document.getElementById("ctabSum").textContent=`${C.unit[0].toUpperCase()+C.unit.slice(1)} → zone table`;
  const rows=[...C.geo.features].sort((a,b)=>a.properties.zone.localeCompare(b.properties.zone)||a.properties.county.localeCompare(b.properties.county));
  document.getElementById("ctab").innerHTML=`<tr><th>${C.unit[0].toUpperCase()+C.unit.slice(1)}</th><th>Zone</th><th>Outlook</th><th>OND crop stage</th></tr>`+
    rows.map(f=>{const z=f.properties.zone;return `<tr><td>${f.properties.county}</td><td>${C.zones[z].name}</td><td>${outLabel(z)}</td><td>${stageLabel(z)}</td></tr>`}).join("");
  document.getElementById("foot").innerHTML=`${C.boundary} Built 2026-10-02 from SERVIR Global Risk Platform evidence pack ${C.pack}. Regenerate with <code>prepare_counties.R</code>, <code>prepare_ethiopia_admin2.R</code>, <code>prepare_uganda_admin2.R</code> and <code>build_eastafrica_map.R</code>.`;
}
function header(){
  document.getElementById("title").textContent=C.title;
  document.getElementById("sub").textContent=C.sub;
  document.getElementById("caveat").innerHTML=cite(C.caveat);
}
function renderAll(){
  header(); drawMap(); paint(); drivers(); calendar(); provenance();
  selected&&C.zones[selected]?select(selected):(selected=null,overview());
  bindCites(document);
}
function setCountry(key){
  C=COUNTRIES[key]||KENYA; selected=null;
  document.querySelectorAll(".cty button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cty===C.key));
  try{history.replaceState(null,"","#"+C.key)}catch(e){}
  renderAll();
}
document.querySelectorAll(".cty button").forEach(b=>b.onclick=()=>setCountry(b.dataset.cty));
document.querySelectorAll("#viewSeg button").forEach(b=>b.onclick=()=>{
  view=b.dataset.view; document.querySelectorAll("#viewSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  paint(); selected?select(selected):overview();
});
document.getElementById("floodChk").onchange=paint;
document.getElementById("themeBtn").onclick=()=>{
  const r=document.documentElement, dark=r.dataset.theme? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme=dark?"light":"dark";
  try{localStorage.setItem("ea-elnino-theme",r.dataset.theme)}catch(e){}
  renderAll();
};
try{const t=localStorage.getItem("ea-elnino-theme"); if(t) document.documentElement.dataset.theme=t;}catch(e){}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",renderAll);
setCountry((location.hash||"").replace("#",""));
</script>
</body>
</html>
